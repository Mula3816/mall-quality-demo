# CI 全量回归流水线
# 触发条件：推送到 main，或向 main 发起 Pull Request。
# 流程：装依赖 → 构建三个前端（tsc 类型检查）→ 安装 Chromium →
#       Playwright 自动拉起四端服务（后端 8000 / 前台 5173 / 后台 5174 / 移动端 5175）→
#       跑全量回归 → 归档 HTML 报告（失败时含截图与 trace）。
name: CI 全量回归

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---- 后端环境 ----
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装后端依赖
        run: pip install -r requirements.txt
        working-directory: mall-backend

      # ---- 前端与测试环境 ----
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装各工程依赖（版本由 package-lock.json 锁定）
        run: |
          npm ci --prefix mall-web
          npm ci --prefix mall-admin
          npm ci --prefix mall-mobile
          npm ci --prefix mall-automation-tests

      - name: 构建三个前端（tsc 类型检查 + vite 打包）
        run: |
          npm run build --prefix mall-web
          npm run build --prefix mall-admin
          npm run build --prefix mall-mobile

      - name: 安装 Playwright Chromium 与系统依赖
        run: npx playwright install --with-deps chromium
        working-directory: mall-automation-tests

      - name: 全量自动化回归（webServer 配置自动拉起四端服务）
        run: npm test
        working-directory: mall-automation-tests

      # ---- 测试产物 ----
      # if: always() 保证即使测试失败也上传报告，便于排查失败用例的截图和 trace。
      - name: 归档 Playwright HTML 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            mall-automation-tests/playwright-report/
            mall-automation-tests/test-results/
          retention-days: 7
